name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "NexiosTV.zip" ]; then
            echo "NexiosTV.zip not found in repository root"
            exit 1
          fi

          unzip -q -o "NexiosTV.zip" -d .

          PROJECT_DIR="$(find . -type f -name gradlew | head -n 1 | xargs -r dirname)"
          if [ -z "${PROJECT_DIR}" ]; then
            echo "Android project not found after extraction"
            find . -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) | head -n 50
            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          chmod +x "${PROJECT_DIR}/gradlew"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexiosTV-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
