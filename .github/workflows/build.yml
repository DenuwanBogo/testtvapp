name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          if [ ! -d "NexiosTV" ]; then
            if [ ! -f "NexiosTV.zip" ]; then
              echo "NexiosTV.zip not found in repository root"
              exit 1
            fi
            unzip -q NexiosTV.zip -d .
          fi

          if [ ! -f "NexiosTV/gradlew" ]; then
            echo "Android project not found after extraction"
            find . -maxdepth 3 -name gradlew -o -name settings.gradle -o -name settings.gradle.kts
            exit 1
          fi

          chmod +x NexiosTV/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: NexiosTV
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NexiosTV-apk
          path: NexiosTV/app/build/outputs/apk/debug/app-debug.apk
