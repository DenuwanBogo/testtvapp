name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "NexiosTV.zip" ]; then
            echo "NexiosTV.zip not found in repository root"
            exit 1
          fi

          unzip -q -o "NexiosTV.zip" -d .

          PROJECT_DIR="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "${PROJECT_DIR}" ]; then
            echo "Android project not found after extraction"
            find . -maxdepth 5 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) | head -n 50
            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"

          if [ -f "${PROJECT_DIR}/gradlew" ]; then
            chmod +x "${PROJECT_DIR}/gradlew"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT is not set"
            exit 1
          fi

          echo "Using Android SDK root: ${ANDROID_SDK_ROOT}"

          yes | sdkmanager --licenses >/dev/null || true

          COMPILE_SDK="$(grep -RhoE 'compileSdk[[:space:]]*(=?[[:space:]]*)?[0-9]+' "$PROJECT_DIR" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+' || echo 34)"
          BUILD_TOOLS="$(grep -RhoE 'buildToolsVersion[[:space:]]*=?[[:space:]]*\"[^\"]+\"' "$PROJECT_DIR" 2>/dev/null | tail -n 1 | sed -E 's/.*\"([^\"]+)\"/\1/' || echo '34.0.0')"

          echo "Detected compileSdk=${COMPILE_SDK} buildTools=${BUILD_TOOLS}"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexiosTV-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
